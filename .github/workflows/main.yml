name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: پیدا کردن مسیر واقعی پروژه
        id: locate
        run: |
          PROJECT_FILE=$(find . -maxdepth 5 -name "pubspec.yaml" -not -path "*/build/*" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "pubspec.yaml پیدا نشد!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "پروژه اینجا پیدا شد: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: ساخت پوشه‌های اندروید (در صورت نبود)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name mindload --org com.mindload.app --platforms=android
          fi

      - name: نصب پکیج‌ها
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      - name: افزودن دسترسی‌های لازم به AndroidManifest
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>|' "$MANIFEST"
          fi

      - name: ساخت APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release

      - name: آپلود APK به عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindload-apk
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
